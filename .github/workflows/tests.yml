name: tests

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - "NOTICE"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - "NOTICE"

permissions:
  contents: read

# A newer push to the same branch makes the older run moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    # Pinned: ubuntu-latest moves to a new release on GitHub's schedule.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Unit tests
        run: python -m pytest -q
      - name: Sample config validates
        run: |
          python - <<'PY'
          from modules.config import Config
          Config("config/config.yml.sample")
          PY
