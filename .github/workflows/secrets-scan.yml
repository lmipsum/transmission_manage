name: secrets-scan

# Runs on every push, including docs-only ones: any tracked file can leak a passkey.
on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  tracker-passkey-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Scan tracked files for tracker-passkey patterns
        run: |
          mapfile -t files < <(git ls-files)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No tracked files."
            exit 0
          fi
          python3 scripts/pre-commit/check_no_tracker_secrets.py "${files[@]}"
