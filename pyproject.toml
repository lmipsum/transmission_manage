[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transmission_manage"
version = "0.1.0.dev0"
description = "Transmission port of qbit_manage: unregistered/tracker-error handling, no-hardlink tagging, orphaned-file cleanup and rechecks"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "lmipsum" }]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.1"]

[project.urls]
Repository = "https://github.com/lmipsum/transmission_manage"
Upstream = "https://github.com/StuffAnthings/qbit_manage"

[tool.setuptools]
py-modules = ["transmission_manage"]
packages = ["modules", "modules.core"]
